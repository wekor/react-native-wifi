name: Android
# Runs only when something the Android build depends on changes. Keep the
# shared paths in sync with ios.yml. merge_group ignores path filters, so a
# merge queue always runs it.
on:
  pull_request:
    branches: [main]
    paths:
      - android/**
      # Shared with iOS
      - src/**
      - plugin/src/**
      - example/**
      # Dependency changes reach bun.lock; the release PR's version bump in
      # package.json doesn't need a native build.
      - bun.lock
      - .nvmrc
      - .bun-version
      - bunfig.toml
      - .github/actions/**
      - .github/workflows/android.yml
  merge_group:
    types: [checks_requested]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: bun run build:android:prepare
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: bun run build:android
